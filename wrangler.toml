name = "kint"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-01"

[vars]
CONTACT_TO = "info@kint.ch"
CONTACT_FROM = "noreply@kint.ch"
ALLOWED_ORIGINS = "https://kint.ch,https://kint-2qa.pages.dev"

# Invio email: le Pages non supportano il binding "send_email" (errore di validazione al deploy).
# Finché non c'è un canale di invio, functions/api/contact.ts risponde con ?error=1 e la pagina
# mostra l'indirizzo info@kint.ch. Vedi README.md, sezione Deploy.
