services:
  title: "Ce que nous faisons"
  intro: "Chaque service répare une fissure. Chacun fonctionne seul ou avec les autres."
  featured:
    id: persone-e-ai
    title: "Des sites pour les personnes et pour les IA"
    text: "Les personnes regardent le design. Les assistants IA lisent la structure. Nous construisons les deux : devant, design, UX et marque ; dessous, données structurées, HTML sémantique et contenus que ChatGPT, Gemini, Claude et Perplexity peuvent lire, comprendre et citer. Nous ne promettons pas de positions : nous mesurons comment évolue votre visibilité sur les IA et nous vous montrons les résultats."
  items:
    - id: siti
      title: "Sites et e-commerce"
      description: "Sites vitrines, boutiques en ligne, landing pages. Multilingue : italien, allemand, français."
      crack: "Beaucoup de personnes aimeraient vous joindre, mais n'y arrivent pas toujours."
      gold: "Un site clair et rapide qui transforme les visites en demandes."
    - id: brand
      title: "Marque et merchandising"
      description: "Logo, identité visuelle, packaging, imprimés, vêtements de travail et objets publicitaires."
      crack: "Ce que vous faites mérite d’être reconnu au premier coup d’œil."
      gold: "Une identité cohérente, de la carte de visite au t-shirt de l’équipe."
    - id: social
      title: "Réseaux sociaux"
      description: "Plan éditorial, publications, reels, gestion de la communauté."
      crack: "Publier régulièrement demande du temps, et le temps manque toujours."
      gold: "Des contenus réguliers qui racontent votre activité pendant que vous vous occupez du reste."
    - id: ai-automazioni
      title: "IA et automatisations"
      description: "Chatbot sur le site, réponses aux avis, devis automatiques, flux automatisés."
      crack: "Les mêmes questions et les mêmes devis reviennent chaque jour."
      gold: "Des chatbots et des flux automatiques qui répondent pour vous, même hors horaires."
    - id: pubblicita
      title: "Publicité payante"
      description: "Google Ads, Meta (Facebook et Instagram), LinkedIn, campagnes géolocalisées."
      crack: "Investir dans la publicité n’a de sens que si vous savez ce qu’elle rapporte."
      gold: "Des campagnes ciblées sur votre région, avec des résultats mesurables."
    - id: seo-geo
      title: "SEO et GEO"
      description: "Visibilité sur Google et sur les assistants IA : fiche Google Business, SEO local, données structurées, suivi de ce que ChatGPT, Gemini, Claude et Perplexity disent de vous."
      crack: "Aujourd’hui, les clients interrogent Google et ChatGPT : mieux vaut être présent dans les deux."
      gold: "Des informations claires et exactes, là où les clients cherchent et là où l’IA répond."
  always_included:
    title: "Toujours inclus"
    items:
      - "Hébergement en Suisse"
      - "Conformité LPD et RGPD"
      - "Mises à jour et maintenance"
      - "Un interlocuteur unique"
  packages:
    title: "Trois façons de travailler ensemble"
    items:
      - name: "Réparation"
        text: "Une intervention ponctuelle sur un point précis."
      - name: "Recomposition"
        text: "Refonte complète de votre présence digitale."
      - name: "Or continu"
        text: "Abonnement mensuel : maintenance, contenus et améliorations dans la durée."
    note: "Prix clair lors de l'appel, sans surprise."
contact:
  title: "Écrivez-nous un mot."
