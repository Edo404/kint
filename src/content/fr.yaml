    privacy_label: "J'ai lu la politique de confidentialité"
    submit: "Envoyer"
    sent: "Merci, nous vous répondons rapidement."
    error: "Envoi impossible. Écrivez-nous à info@kint.ch."
  faq:
    title: "Questions fréquentes"
    items:
      - q: "Comment obtenir un devis ?"
        a: "Contactez-nous via le formulaire, par e-mail ou par téléphone. Après un bref échange sur vos besoins, nous vous proposons plusieurs options à choisir."
      - q: "Combien coûte un site ou un service Kint ?"
        a: "Cela dépend du projet. Nous ne vendons pas de packs standard, pour ne pas tomber dans des travaux génériques. Nous vous donnons un prix clair lors de l'appel, avant de commencer."
      - q: "Où êtes-vous basés et où travaillez-vous ?"
        a: "Notre siège est à Lugano, au Tessin. Nous travaillons avec des entreprises en Suisse et en Italie, aussi à distance."
      - q: "Qui êtes-vous ?"
        a: "Une équipe aux parcours variés : management, informatique, startups, investissements et réseaux sociaux."
      - q: "Comment suivre l'avancement du travail ?"
        a: "Vous recevez des liens d'aperçu, des ébauches graphiques et des tests tout au long du projet. Chaque projet dispose d'une adresse e-mail dédiée @kint.ch et d'une équipe qui répond à vos questions."
      - q: "En combien de temps mon projet est-il prêt ?"
        a: "Vous recevez une estimation des délais avec le devis. Un site vitrine peut être en ligne en 10 jours."
      - q: "Quelles garanties offrez-vous ?"
        a: "Si le résultat ne vous satisfait pas, nous vous trouvons une alternative externe sans frais pour vous."
      - q: "Que signifie qu'un site est AI-ready ?"
        a: "Cela signifie qu'en plus d'être beau et utilisable, il est structuré pour être lu par des assistants comme ChatGPT, Gemini et Claude : données structurées, HTML sémantique, informations claires sur les services et les contacts. Ainsi, les IA comprennent qui vous êtes et peuvent vous citer correctement."
      - q: "Où sont hébergées les données ?"
        a: "L'hébergement est en Suisse. Nous respectons la LPD suisse et le RGPD européen."
