services:
  title: "Was wir tun"
  intro: "Jede Leistung repariert einen Riss. Jede funktioniert allein oder zusammen mit den anderen."
  featured:
    id: persone-e-ai
    title: "Websites für Menschen und für KI"
    text: "Menschen achten auf das Design. KI-Assistenten lesen die Struktur. Wir bauen beides: vorne Design, UX und Marke; darunter strukturierte Daten, semantisches HTML und Inhalte, die ChatGPT, Gemini, Claude und Perplexity lesen, verstehen und zitieren können. Wir versprechen keine Platzierungen: Wir messen, wie sich Ihre Sichtbarkeit bei KI verändert, und zeigen Ihnen die Ergebnisse."
  items:
    - id: siti
      title: "Websites und E-Commerce"
      description: "Unternehmenswebsites, Onlineshops, Landingpages. Mehrsprachig: Italienisch, Deutsch, Französisch."
      crack: "Viele Menschen möchten Sie erreichen, schaffen es aber nicht immer."
      gold: "Eine klare, schnelle Website, die Besuche in Anfragen verwandelt."
    - id: brand
      title: "Marke und Merchandising"
      description: "Logo, visuelle Identität, Verpackung, Drucksachen, Arbeitskleidung und Werbeartikel."
      crack: "Was Sie tun, verdient es, auf den ersten Blick erkannt zu werden."
      gold: "Ein einheitlicher Auftritt, von der Visitenkarte bis zum T-Shirt des Teams."
    - id: social
      title: "Social Media"
      description: "Redaktionsplan, Beiträge, Reels, Community-Management."
      crack: "Regelmässig zu posten braucht Zeit, und Zeit ist immer knapp."
      gold: "Regelmässige Inhalte, die Ihr Geschäft erzählen, während Sie sich um den Rest kümmern."
    - id: ai-automazioni
      title: "KI und Automatisierung"
      description: "Chatbots auf der Website, Antworten auf Bewertungen, automatische Offerten, automatisierte Abläufe."
      crack: "Dieselben Fragen und dieselben Offerten kommen jeden Tag wieder."
      gold: "Chatbots und automatische Abläufe, die für Sie antworten, auch ausserhalb der Öffnungszeiten."
    - id: pubblicita
      title: "Bezahlte Werbung"
      description: "Google Ads, Meta (Facebook und Instagram), LinkedIn, geografisch ausgerichtete Kampagnen."
      crack: "Werbung lohnt sich nur, wenn Sie wissen, was sie zurückbringt."
      gold: "Kampagnen gezielt für Ihre Region, mit messbaren Ergebnissen."
    - id: seo-geo
      title: "SEO und GEO"
      description: "Sichtbarkeit auf Google und bei KI-Assistenten: Google-Unternehmensprofil, lokales SEO, strukturierte Daten, Beobachtung, wie ChatGPT, Gemini, Claude und Perplexity über Sie sprechen."
      crack: "Kunden fragen heute Google und ChatGPT: Es lohnt sich, in beiden präsent zu sein."
      gold: "Klare, korrekte Informationen dort, wo Kunden suchen und wo KI antwortet."
  always_included:
    title: "Immer inbegriffen"
    items:
      - "Hosting in der Schweiz"
      - "Konformität mit DSG und DSGVO"
      - "Aktualisierungen und Wartung"
      - "Eine feste Ansprechperson"
  packages:
    title: "Drei Arten der Zusammenarbeit"
    items:
      - name: "Reparatur"
        text: "Ein einzelner Eingriff an einem bestimmten Punkt."
      - name: "Neuaufbau"
        text: "Vollständige Erneuerung Ihrer digitalen Präsenz."
      - name: "Laufendes Gold"
        text: "Monatliches Abonnement: Wartung, Inhalte und Verbesserungen über die Zeit."
    note: "Klarer Preis im Gespräch, keine Überraschungen."
