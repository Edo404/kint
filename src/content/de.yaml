  faq:
    title: "Häufige Fragen"
    items:
      - q: "Wie erhalte ich eine Offerte?"
        a: "Kontaktieren Sie uns über das Formular, per E-Mail oder telefonisch. Nach einem kurzen Austausch über Ihre Bedürfnisse schlagen wir Ihnen mehrere Optionen zur Auswahl vor."
      - q: "Was kostet eine Website oder eine Leistung von Kint?"
        a: "Das hängt vom Projekt ab. Wir verkaufen keine Standardpakete, um nicht bei Massenware zu landen. Sie erhalten im Gespräch einen klaren Preis, bevor wir beginnen."
      - q: "Wo sind Sie und wo arbeiten Sie?"
        a: "Unser Sitz ist in Lugano im Tessin. Wir arbeiten mit Unternehmen in der Schweiz und in Italien, auch aus der Ferne."
      - q: "Wer sind Sie?"
        a: "Ein Team mit unterschiedlichen Hintergründen: Management, Informatik, Startups, Investitionen und Social Media."
      - q: "Wie verfolge ich den Fortschritt der Arbeit?"
        a: "Sie erhalten während des ganzen Projekts Vorschau-Links, grafische Entwürfe und Tests. Jedes Projekt hat eine eigene E-Mail-Adresse @kint.ch und ein Team, das Ihre Fragen beantwortet."
      - q: "Wie schnell ist mein Projekt fertig?"
        a: "Sie erhalten eine Zeitschätzung zusammen mit der Offerte. Eine Visitenkarten-Website kann in 10 Tagen online sein."
      - q: "Welche Garantien bieten Sie?"
        a: "Wenn das Ergebnis Sie nicht zufriedenstellt, finden wir für Sie eine externe Alternative ohne Kosten für Sie."
      - q: "Was bedeutet es, dass eine Website KI-ready ist?"
        a: "Es bedeutet, dass sie nicht nur schön und benutzbar ist, sondern auch so aufgebaut, dass Assistenten wie ChatGPT, Gemini und Claude sie lesen können: strukturierte Daten, semantisches HTML, klare Angaben zu Leistungen und Kontakt. So verstehen die KI, wer Sie sind, und können Sie korrekt zitieren."
      - q: "Wo werden die Daten gehostet?"
        a: "Das Hosting erfolgt in der Schweiz. Wir halten das Schweizer DSG und die europäische DSGVO ein."
