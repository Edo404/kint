presentation:
  h1: Il partner digitale delle piccole imprese.
  subtitle: Siti belli per le persone. Leggibili dalle AI.
  paragraph: "Kint costruisce la presenza digitale di piccole imprese in Italia e in Svizzera: sito, brand, social, Google e automazioni. Ogni sito è progettato per essere usato dai clienti e letto da ChatGPT, Gemini, Claude e dagli altri assistenti AI che oggi guidano le scelte di acquisto."
  cta_primary:
    label: Scrivici due righe
    href: "#contatti"
  kintsugi:
    title: Perché Kint
    text: "Kint viene dal kintsugi, l'arte giapponese di riparare la ceramica rotta con l'oro. Non nasconde la frattura: la valorizza. Facciamo lo stesso con la tua presenza online. Un sito vecchio, zero prenotazioni, recensioni senza risposta: per noi sono crepe. Le ripariamo e le rendiamo la parte migliore."
  values:
    - title: Trasparenza
      text: Opzioni e costi chiari fin dalla prima call. Vogliamo rendere competitiva la tua impresa, non renderti dipendente da noi.
    - title: Rapidità
      text: Lavoriamo per obiettivi, non per ore. Ricevi anteprime e bozze durante tutto il progetto.
    - title: Responsabilità
      text: Ci prendiamo carico del problema. Se non possiamo risolverlo direttamente, troviamo il professionista giusto.
    - title: Qualità
      text: Non puntiamo al prezzo più basso. Puntiamo a risultati che nel tempo fanno risparmiare.
sectors:
  title: Parliamo la lingua del tuo mestiere.
  intro: Ogni settore ha problemi tipici e soluzioni già pensate. Trova il tuo.
  closing:
    text: Non ti riconosci? Scrivici due righe.
  # Sotto-landing per settore: indirizzo e logo in site.yaml (stesso id)
  landings:
    - id: ristoranti
      name: "Ristoranti"
      line: "Ristoranti, bar, grotti, B&B, piccoli hotel, agriturismi"
    - id: palestre
      name: "Palestre"
      line: "Palestre, centri fitness e studi di allenamento"
    - id: studi
      name: "Studi professionali"
      line: "Commercialisti, fiduciarie, avvocati e consulenti"
  items:
    - id: ristorazione
      name: Ristorazione e ospitalità
      for_whom: Ristoranti, bar, grotti, B&B, piccoli hotel, agriturismi
      problem: Il cliente cerca su Google, trova un menu in PDF illeggibile da telefono e non riesce a prenotare. Sceglie un altro locale.
      what_we_do: Sito veloce con menu aggiornabile, prenotazioni dirette e recensioni sotto controllo.
      key_services:
        - Menu digitale multilingua
        - Prenotazioni online e recensioni Google
        - Reel e contenuti social
      linked_services:
        - siti
        - seo-geo
        - social
    - id: agroalimentare
      name: Agroalimentare e cantine
      for_whom: Cantine, caseifici, frantoi, birrifici, produttori di prodotti tipici
      problem: Il prodotto è eccellente ma si vende solo in fiera e col passaparola. Gli intermediari tengono il margine.
      what_we_do: Vendita diretta online, confezioni coerenti con il prodotto, materiali per fiere e degustazioni.
      key_services:
        - E-commerce per vendita diretta
        - Packaging ed etichette
        - Gadget per fiere e degustazioni
      linked_services:
        - siti
        - brand
    - id: artigiani-edilizia
      name: Artigiani ed edilizia
      for_whom: Idraulici, elettricisti, serramentisti, imprese edili
      problem: I clienti chiamano chi trovano per primo su Google. Il tuo sito è assente o non si legge da telefono. Ogni preventivo richiede più telefonate.
      what_we_do: Sito semplice, richiesta di preventivo via WhatsApp con foto, visibilità su Google nella tua zona.
      key_services:
        - Sito leggibile da smartphone, anche in cantiere
        - Preventivo via WhatsApp con foto
        - Visibilità su Google nella propria zona
      linked_services:
        - siti
        - ai-automazioni
        - seo-geo
    - id: studi-professionali
      name: Studi professionali
      for_whom: Fiduciarie, avvocati, commercialisti, architetti
      problem: La fiducia si decide prima del primo contatto. Un sito datato o assente e nessuna presenza professionale online costano clienti.
      what_we_do: Sito autorevole con pagina team, profilo LinkedIn curato, appuntamenti prenotabili online.
      key_services:
        - Sito autorevole con pagina team
        - Presenza curata su LinkedIn
        - Prenotazione appuntamenti online
      linked_services:
        - siti
        - social
        - ai-automazioni
    - id: salute-benessere
      name: Salute e benessere
      for_whom: Dentisti, fisioterapisti, studi medici, estetica, palestre
      problem: L'agenda si gestisce al telefono, gli appuntamenti saltano, le recensioni restano senza risposta.
      what_we_do: Agenda online, promemoria automatici, gestione delle recensioni.
      key_services:
        - Agenda online
        - Promemoria automatici per pazienti e clienti
        - Gestione delle recensioni
      linked_services:
        - siti
        - ai-automazioni
        - seo-geo
    - id: negozi-retail
      name: Negozi e retail
      for_whom: Boutique, ottici, gioiellerie, negozi di quartiere
      problem: Il negozio è vivo in vetrina ma invisibile online. I clienti della zona non sanno cosa hai.
      what_we_do: Instagram gestito, ordine online con ritiro in negozio, campagne locali mirate.
      key_services:
        - Instagram gestito
        - Click & collect
        - Campagne locali mirate
      linked_services:
        - social
        - siti
        - pubblicita
    - id: auto-moto-immobiliare
      name: Auto, moto e immobiliare
      for_whom: Concessionari, officine, noleggio, agenzie immobiliari
      problem: Schede povere si perdono tra i portali. I contatti arrivano, ma poco qualificati.
      what_we_do: Schede curate di veicoli e immobili, foto e video professionali, pubblicità che porta richieste concrete.
      key_services:
        - Schede veicolo o immobile curate
        - Lead da pubblicità a pagamento
        - Video e foto professionali
      linked_services:
        - siti
        - pubblicita
    - id: industria-b2b
      name: Industria e B2B
      for_whom: Produttori, logistica, aziende familiari
      problem: Cataloghi in PDF, processi manuali, presenza in fiera scollegata dal digitale.
      what_we_do: Catalogo digitale, materiali per le fiere, automazioni AI sui processi ripetitivi.
      key_services:
        - Catalogo digitale
        - Materiali e gadget per fiere
        - Automazioni AI sui processi
      linked_services:
        - siti
        - brand
        - ai-automazioni
    - id: nuove-aperture
      name: Nuove aperture e startup
      for_whom: Nuove attività, startup, spin-off
      problem: "Si parte da zero: nessun nome riconoscibile, nessuna presenza online, poco tempo e poco budget."
      what_we_do: Brand, sito, social e Google pronti al giorno del lancio, più un kit gadget di apertura.
      key_services:
        - "Brand completo: logo e identità visiva"
        - Sito, social e Google pronti al lancio
        - Kit gadget di apertura
      linked_services:
        - brand
        - siti
        - social
services:
  title: Cosa facciamo
  intro: Ogni servizio ripara una crepa. Ognuno funziona da solo o insieme agli altri.
  featured:
    id: persone-e-ai
    title: Siti per persone e per AI
    text: "Le persone guardano il design. Gli assistenti AI leggono la struttura. Costruiamo entrambe: davanti, design, UX e brand; sotto, dati strutturati, HTML semantico e contenuti che ChatGPT, Gemini, Claude e Perplexity possono leggere, capire e citare. Non promettiamo posizioni: misuriamo come cambia la tua visibilità sulle AI e ti mostriamo i risultati."
  items:
    - id: siti
      title: "Siti ed e-commerce"
      description: "Siti vetrina, shop online, landing page. Multilingua italiano, tedesco, francese."
      crack: "Molte persone vorrebbero raggiungerti, ma non sempre ci riescono."
      gold: "Un sito chiaro e veloce che trasforma le visite in richieste."
    - id: brand
      title: "Brand e merchandising"
      description: "Logo, identità visiva, packaging, stampati, abbigliamento da lavoro e gadget."
      crack: "Quello che fai merita di essere riconosciuto al primo sguardo."
      gold: "Un'identità coerente, dal biglietto da visita alla maglietta del team."
    - id: social
      title: "Social media"
      description: "Piano editoriale, post, reel, gestione della community."
      crack: "Pubblicare con costanza richiede tempo, e il tempo non basta mai."
      gold: "Contenuti regolari che raccontano la tua attività, mentre tu pensi al resto."
    - id: ai-automazioni
      title: "AI e automazioni"
      description: "Chatbot sul sito, risposte alle recensioni, preventivi automatici, flussi automatizzati."
      crack: "Le stesse domande e gli stessi preventivi tornano ogni giorno."
      gold: "Chatbot e flussi automatici che rispondono per te, anche fuori orario."
    - id: pubblicita
      title: "Pubblicità a pagamento"
      description: "Google Ads, Meta (Facebook e Instagram), LinkedIn, campagne geolocalizzate."
      crack: "Investire in pubblicità ha senso solo se sai cosa ti ritorna."
      gold: "Campagne mirate sulla tua zona, con risultati che puoi misurare."
    - id: seo-geo
      title: "SEO e GEO"
      description: "Visibilità su Google e sugli assistenti AI: scheda Google Business, SEO locale, dati strutturati, monitoraggio di come ChatGPT, Gemini, Claude e Perplexity parlano di te."
      crack: "Oggi i clienti chiedono a Google e a ChatGPT: vale la pena esserci in entrambi."
      gold: "Informazioni chiare e corrette, dove i clienti cercano e dove le AI rispondono."
  always_included:
    title: Sempre inclusi
    items:
      - Hosting in Svizzera
      - Conformità LPD e GDPR
      - Aggiornamenti e manutenzione
      - Un referente unico
  packages:
    title: Tre modi di lavorare insieme
    items:
      - name: Riparazione
        text: Un intervento singolo su un punto preciso.
      - name: Ricomposizione
        text: Rifacimento completo della tua presenza digitale.
      - name: Oro continuo
        text: "Abbonamento mensile: manutenzione, contenuti e miglioramenti nel tempo."
    note: Prezzo chiaro in call, nessuna sorpresa.
contact:
  title: Scrivici due righe.
  intro: Raccontaci la tua attività. Ti rispondiamo con una proposta chiara.
  call:
    title: "Prima call: 20 minuti online"
    text: Prima della call guardiamo la tua presenza online. Ti diciamo cosa non funziona, cosa si può fare e con quale approccio. Decidi tu se andare avanti.
    cta_label: Prenota la call
  details:
    email: info@kint.ch
    address: Lugano, Ticino, Svizzera
    labels:
      email: Email
      address: Sede
      phone: Telefono
      hours: Orari
  form:
    name: Nome
    email: Email
    phone: Telefono
    company: Azienda
    sector: Settore
    sector_other: Altro
    message: Messaggio
    privacy_label: Ho letto l'informativa privacy
    submit: Invia
    sent: Grazie, ti rispondiamo presto.
    error: Invio non riuscito. Scrivici a info@kint.ch.
  faq:
    title: Domande frequenti
    items:
      - q: Come ottengo un preventivo?
        a: Contattaci con il modulo, per email o al telefono. Dopo un breve confronto sulle tue esigenze ti proponiamo più opzioni tra cui scegliere.
      - q: Quanto costa un sito o un servizio Kint?
        a: Dipende dal progetto. Non vendiamo pacchetti standard per non scadere in lavori generici. Ti diamo un prezzo chiaro in call, prima di iniziare.
      - q: Dove vi trovate e dove lavorate?
        a: La sede è a Lugano, in Ticino. Lavoriamo con imprese in Svizzera e in Italia, anche da remoto.
      - q: Chi siete?
        a: "Un team con background diversi: management, informatica, startup, investimenti e social media."
      - q: Come seguo l'avanzamento del lavoro?
        a: Ricevi link di anteprima, bozze grafiche e test durante tutto il progetto. Ogni progetto ha un indirizzo email dedicato @kint.ch e un team che risponde alle tue domande.
      - q: In quanto tempo è pronto il mio progetto?
        a: Ricevi una stima dei tempi insieme al preventivo. Un sito vetrina può essere online in 10 giorni.
      - q: Che garanzie offrite?
        a: Se il risultato non ti soddisfa, ti troviamo un'alternativa esterna senza costi per te.
      - q: Cosa significa che un sito è AI-ready?
        a: "Significa che, oltre a essere bello e usabile, è strutturato per essere letto da assistenti come ChatGPT, Gemini e Claude: dati strutturati, HTML semantico, informazioni chiare su servizi e contatti. Così le AI capiscono chi sei e possono citarti correttamente."
      - q: Dove sono ospitati i dati?
        a: L'hosting è in Svizzera. Rispettiamo la LPD svizzera e il GDPR europeo.
