services:
  title: "What we do"
  intro: "Every service repairs a crack. Each one works alone or together with the others."
  featured:
    id: persone-e-ai
    title: "Websites for people and for AI"
    text: "People look at the design. AI assistants read the structure. We build both: on the surface, design, UX and brand; underneath, structured data, semantic HTML and content that ChatGPT, Gemini, Claude and Perplexity can read, understand and cite. We do not promise rankings: we measure how your visibility on AI changes and show you the results."
  items:
    - id: siti
      title: "Websites and e-commerce"
      description: "Showcase sites, online shops, landing pages. Multilingual: Italian, German, French."
      crack: "Many people would like to reach you, but they don't always manage to."
      gold: "A clear, fast website that turns visits into enquiries."
    - id: brand
      title: "Brand and merchandise"
      description: "Logo, visual identity, packaging, print, workwear and branded merchandise."
      crack: "What you do deserves to be recognised at first glance."
      gold: "A consistent identity, from the business card to the team's T-shirt."
    - id: social
      title: "Social media"
      description: "Content plan, posts, reels, community management."
      crack: "Posting consistently takes time, and there is never enough of it."
      gold: "Regular content that tells your story while you focus on the rest."
    - id: ai-automazioni
      title: "AI and automation"
      description: "Website chatbots, review replies, automated quotes, automated workflows."
      crack: "The same questions and the same quotes come back every day."
      gold: "Chatbots and automated workflows that answer for you, even after hours."
    - id: pubblicita
      title: "Paid advertising"
      description: "Google Ads, Meta (Facebook and Instagram), LinkedIn, geo-targeted campaigns."
      crack: "Advertising only makes sense if you know what it brings back."
      gold: "Campaigns targeted to your area, with results you can measure."
    - id: seo-geo
      title: "SEO and GEO"
      description: "Visibility on Google and on AI assistants: Google Business Profile, local SEO, structured data, monitoring how ChatGPT, Gemini, Claude and Perplexity talk about you."
      crack: "Customers now ask both Google and ChatGPT: it pays to be found in both."
      gold: "Clear, accurate information where customers search and where AI answers."
  always_included:
    title: "Always included"
    items:
      - "Hosting in Switzerland"
      - "Swiss FADP and GDPR compliance"
      - "Updates and maintenance"
      - "A single point of contact"
  packages:
    title: "Three ways of working together"
    items:
      - name: "Repair"
        text: "A single intervention on one specific point."
      - name: "Reassembly"
        text: "A complete rebuild of your digital presence."
      - name: "Ongoing Gold"
        text: "Monthly subscription: maintenance, content and improvements over time."
    note: "Clear pricing on the call, no surprises."
contact:
  title: "Drop us a line."
  intro: "Tell us about your business. We will reply with a clear proposal."
  call:
    title: "First call: 20 minutes online"
    text: "Before the call we look at your online presence. We tell you what is not working, what can be done and with which approach. You decide whether to go ahead."
    cta_label: "Book the call"
  details:
    email: "info@kint.ch"
    address: "Lugano, Ticino, Switzerland"
    labels:
      email: "Email"
      address: "Office"
      phone: "Phone"
      hours: "Opening hours"
  form:
    name: "Name"
    email: "Email"
    phone: "Phone"
    company: "Company"
    sector: "Sector"
    sector_other: "Other"
    message: "Message"
    privacy_label: "I have read the privacy notice"
    submit: "Send"
    sent: "Thank you, we will reply shortly."
    error: "Sending failed. Please write to info@kint.ch."
  faq:
    title: "Frequently asked questions"
    items:
      - q: "How do I get a quote?"
        a: "Contact us through the form, by email or by phone. After a short discussion of your needs we propose several options to choose from."
      - q: "How much does a Kint website or service cost?"
        a: "It depends on the project. We do not sell standard packages, so as not to end up with generic work. We give you a clear price on the call, before we start."
      - q: "Where are you based and where do you work?"
        a: "Our office is in Lugano, Ticino. We work with businesses in Switzerland and Italy, also remotely."
      - q: "Who are you?"
        a: "A team with diverse backgrounds: management, IT, startups, investments and social media."
      - q: "How do I follow the progress of the work?"
        a: "You receive preview links, graphic drafts and tests throughout the project. Every project has a dedicated @kint.ch email address and a team that answers your questions."
      - q: "How long until my project is ready?"
        a: "You receive an estimate of the timing together with the quote. A showcase website can be online in 10 days."
      - q: "What guarantees do you offer?"
        a: "If you are not satisfied with the result, we find you an external alternative at no cost to you."
      - q: "What does it mean that a website is AI-ready?"
        a: "It means that, besides being beautiful and usable, it is structured to be read by assistants such as ChatGPT, Gemini and Claude: structured data, semantic HTML, clear information about services and contacts. This way AI understands who you are and can cite you correctly."
      - q: "Where is the data hosted?"
        a: "Hosting is in Switzerland. We comply with the Swiss FADP and the European GDPR."
